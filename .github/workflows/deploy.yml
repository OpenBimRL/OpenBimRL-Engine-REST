permissions:
  packages: write
  contents: read

name: Build and publish a Docker image to ghcr.io
on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io

jobs:
  docker_publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Read REST version from MODULE.bazel
        id: rest_version
        run: |
          version=$(grep -E '^\s*version\s*=' MODULE.bazel | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.rest_version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.REPO }}:latest
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_ACCESS_TOKEN=${{ secrets.GITHUB_TOKEN }}
            ENGINE_RUNTIME_IMAGE=ghcr.io/openbimrl/openbimrl-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
